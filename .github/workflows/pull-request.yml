name: Pull Request
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - 'main'
  workflow_dispatch:
jobs:
  build-pull-request:
    name: Build Pull Request
    uses: ./.github/workflows/common.yml
    with:
      type: PullRequest
      build-task: buildDebug
      artifact-path: build/libs/I18nUpdateMod-*-debug.jar